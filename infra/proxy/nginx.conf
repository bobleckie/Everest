# Outer proxy — TLS termination + redirect HTTP→HTTPS.
# Forwards everything to the inner frontend nginx (which serves the
# SPA and proxies /api/* to the backend).

# 1. HTTP listener — redirect to HTTPS.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# 2. HTTPS listener — terminate TLS, forward to inner nginx.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    # Sane TLS — no SSLv3, no TLSv1.0/1.1.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 250m;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Generate a request id at the edge if the client didn't send one.
        # The backend's RequestIdMiddleware will use this verbatim.
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
