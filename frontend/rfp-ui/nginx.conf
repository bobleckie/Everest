# Inner nginx — serves the React build and proxies /api -> backend.
# TLS is handled by the OUTER proxy at infra/proxy/. Don't enable it here.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # 200 MB matches MAX_FILE_SIZE in app/routers/ingestion.py.
    client_max_body_size 250m;

    # Don't cache index.html so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Hashed CRA assets are immutable.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # API → backend container. Streaming-friendly settings (LLM responses
    # can be slow; extraction endpoint can take 5+ minutes).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Request id passthrough — back end picks this up in
        # RequestIdMiddleware so a correlation id survives across hops.
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Health probe path used by the OUTER proxy.
    location = /healthz {
        access_log off;
        proxy_pass http://backend:8000/healthz;
    }

    # SPA fallback — React Router owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version in error pages.
    error_page 404 /index.html;
}
