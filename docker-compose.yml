version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: rfp_user
      POSTGRES_PASSWORD: rfp_password
      POSTGRES_DB: rfp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://rfp_user:rfp_password@db:5432/rfp_db
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: